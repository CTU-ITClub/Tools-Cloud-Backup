services:
  media-cloud:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      TDLIB_PATH: /app/tdlib-native/lib/libtdjson.so.1.8.67
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/auth/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  backup:
    build:
      context: .
      target: backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      media-cloud:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      BACKUP_APP_URL: http://media-cloud:3000
